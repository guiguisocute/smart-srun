name: Go SDK build (no publication)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Display version: X.Y.Z or X.Y.ZrcN"
        required: true
        default: "2.0.0rc1"
        type: string

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      go_version: ${{ steps.targets.outputs.go_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: targets
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          catalog = json.loads(Path('targets.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'target': [t['id'] for t in catalog['targets']]}) + '\n')
              output.write('go_version=' + catalog['go_version'] + '\n')
          PY

  build:
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.targets.outputs.go_version }}
          cache: false
      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl zstd
      - name: Build pinned SDK packages
        env:
          DISPLAY_VERSION: ${{ inputs.version }}
          TARGET_ID: ${{ matrix.target }}
        run: |
          python3 scripts/build_go_sdk.py --target "$TARGET_ID" \
            --version "$DISPLAY_VERSION" --work-dir "$RUNNER_TEMP/smart-srun-sdk" \
            --bootstrap "$(go env GOROOT)" --jobs 2
      - name: Upload build records and packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-sdk-${{ matrix.target }}
          path: ${{ runner.temp }}/smart-srun-sdk/${{ matrix.target }}/artifacts/
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-sdk-log-${{ matrix.target }}
          path: ${{ runner.temp }}/smart-srun-sdk/${{ matrix.target }}/build.log
          if-no-files-found: warn
